<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم | ALAA BUILDING</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0e10;--p1:rgba(255,255,255,.04);--or:#ff7a1a;--line:rgba(255,255,255,.11);--txt:#f2f2f0}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 16px}
.box{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:600px;margin-bottom:18px}
h2{color:var(--or);text-align:center;margin-bottom:18px;font-weight:900}
h3{font-size:1rem;margin-bottom:10px}
.fg{margin-bottom:14px}
label{display:block;margin-bottom:5px;font-size:.9rem;color:#aaa}
input{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);color:#fff;padding:12px;border-radius:8px;outline:none;transition:.3s;font-size:1rem}
input:focus{border-color:var(--or)}
.btn{width:100%;background:var(--or);color:#111;border:none;padding:12px;border-radius:8px;font-weight:800;cursor:pointer;font-size:1rem;margin-top:8px;transition:.3s}
.btn:hover{background:#ff9140}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.danger{background:rgba(255,85,85,.1);color:#ff6b6b;border:1px solid #ff5555}
.btn.danger:hover{background:#ff5555;color:#fff}
.btn.sm{padding:6px 12px;font-size:.85rem;width:auto;margin:0}
#adminPanel{display:none;width:100%;max-width:800px}
#adminPanel .box{max-width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.msg{text-align:center;margin-top:10px;font-size:.9rem;font-weight:700;min-height:1.3em;overflow-wrap:anywhere}
.err{color:#ff6b6b}.ok{color:#6be08a}
.hint{font-size:.8rem;color:#8c8c93;margin-top:6px}

/* photo staging */
.pick{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pick .btn{width:auto;margin:0;padding:10px 18px}
.count{color:#aaa;font-size:.9rem}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:12px}
.th{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;aspect-ratio:1}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .no{position:absolute;top:4px;inset-inline-start:4px;background:rgba(0,0,0,.75);border-radius:6px;padding:0 7px;font-weight:800;font-size:.8rem}
.th .ctl{position:absolute;bottom:0;left:0;right:0;display:flex;background:rgba(0,0,0,.72)}
.th .ctl button{flex:1;background:none;border:none;color:#fff;padding:5px 0;cursor:pointer;font-size:.95rem}
.th .ctl button:hover{background:var(--or);color:#111}
.th .ctl button.x{color:#ff7b7b}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin-top:12px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--or);transition:width .25s}

.pi{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.02);border:1px solid var(--line);padding:14px;border-radius:12px;margin-bottom:10px}
.pi h4{margin-bottom:3px}.pi p{font-size:.8rem;color:#aaa}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- login -->
<div class="box" id="loginPanel">
  <h2>تسجيل الدخول للإدارة</h2>
  <form id="loginForm">
    <div class="fg"><label>البريد الإلكتروني</label><input type="email" id="email" required autocomplete="username"></div>
    <div class="fg"><label>كلمة المرور</label><input type="password" id="pwd" required autocomplete="current-password"></div>
    <button type="submit" class="btn" id="loginBtn">دخول</button>
    <div id="loginMsg" class="msg err"></div>
  </form>
</div>

<div id="adminPanel">
  <!-- add project -->
  <div class="box">
    <h2>إضافة مشروع جديد</h2>
    <form id="addProjectForm">
      <div class="grid2">
        <div class="fg"><label>اسم المشروع (عربي)</label><input type="text" id="t_ar" placeholder="مثال: عمارة سكنية" required></div>
        <div class="fg"><label>اسم المشروع (فرنسي)</label><input type="text" id="t_fr" placeholder="Ex: Immeuble" required></div>
        <div class="fg"><label>الولاية (عربي)</label><input type="text" id="loc_ar" placeholder="مثال: وهران" required></div>
        <div class="fg"><label>الولاية (فرنسي)</label><input type="text" id="loc_fr" placeholder="Ex: Oran" required></div>
      </div>
      <div class="fg"><label>عدد الطوابق</label><input type="number" id="levels" min="1" max="60" placeholder="مثال: 3" required></div>

      <div class="fg">
        <label>صور المشروع — بالترتيب الذي تظهر به في الموقع</label>
        <div class="pick">
          <button type="button" class="btn ghost" id="pickBtn">＋ اختيار صور</button>
          <span class="count" id="count">لم تُختَر صور بعد</span>
        </div>
        <input type="file" id="photos" multiple accept="image/*" hidden>
        <div class="hint">اختر عدة صور معاً. يمكنك ترتيبها (▲/▼) أو حذفها (✕) قبل النشر.</div>
        <div class="thumbs" id="thumbs"></div>
      </div>

      <div class="bar" id="bar"><i id="barI"></i></div>
      <button type="submit" class="btn" id="addBtn">رفع ونشر المشروع</button>
      <div id="addMsg" class="msg"></div>
    </form>
  </div>

  <!-- projects -->
  <div class="box">
    <h2>المشاريع الحالية</h2>
    <div id="projectsList"><p style="text-align:center;color:#aaa">جاري تحميل المشاريع...</p></div>
    <button id="logoutBtn" class="btn danger" style="margin-top:24px">تسجيل الخروج</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, deleteDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// إعدادات Firebase الخاصة بمشروعك
const firebaseConfig={apiKey:"AIzaSyCu-ZLIqFgvZSEm8KSn7Seh1X9lnHhGSh0",authDomain:"shop-clothes-224a3.firebaseapp.com",projectId:"shop-clothes-224a3"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);

// إعدادات Telegram المخبأة هنا مباشرة
const TG_TOKEN = "9242734114:AAGLI4dhUGnR4EgTm9aqN-7wjbNB6tYTl9k";
const TG_CHAT = "-1002340332851"; 

const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- auth ---------- */
const AUTH_ERR={
  'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة.',
  'auth/wrong-password':'كلمة المرور غير صحيحة.',
  'auth/user-not-found':'هذا الحساب غير موجود.',
  'auth/invalid-email':'صيغة البريد غير صحيحة.',
  'auth/too-many-requests':'محاولات كثيرة، انتظر قليلاً.',
  'auth/network-request-failed':'لا يوجد اتصال بالإنترنت.'
};
let unsub=null;
onAuthStateChanged(auth,user=>{
  if(user){
    $('loginPanel').style.display='none';$('adminPanel').style.display='block';
    if(unsub)unsub();unsub=loadProjects();
  }else{
    if(unsub){unsub();unsub=null}
    $('loginPanel').style.display='block';$('adminPanel').style.display='none';
  }
});
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const b=$('loginBtn'),m=$('loginMsg');
  b.disabled=true;b.textContent='جاري التحقق...';m.textContent='';
  try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('pwd').value)}
  catch(err){console.error(err);m.textContent=(AUTH_ERR[err.code]||'تعذّر الدخول')+' ['+(err.code||err.message)+']'}
  b.disabled=false;b.textContent='دخول';
});
$('logoutBtn').addEventListener('click',()=>signOut(auth));

/* ---------- projects list (with delete) ---------- */
function loadProjects(){
  return onSnapshot(collection(db,'projects'),snap=>{
    const list=$('projectsList');list.innerHTML='';
    if(snap.empty){list.innerHTML='<p style="text-align:center;color:#aaa">لا توجد مشاريع.</p>';return}
    snap.forEach(d=>{
      const x=d.data(),row=document.createElement('div');row.className='pi';
      const info=document.createElement('div');
      const h=document.createElement('h4');h.textContent=(x.t&&x.t.ar)||'مشروع';
      const p=document.createElement('p');p.textContent=`${(x.loc&&x.loc.ar)||''} — الطوابق: ${x.levels||0} | الصور: ${x.photos?x.photos.length:0}`;
      info.append(h,p);
      const del=document.createElement('button');del.className='btn danger sm';del.textContent='حذف';del.dataset.id=d.id;
      row.append(info,del);list.appendChild(row);
    });
  },err=>{console.error(err);$('projectsList').innerHTML='<p class="err" style="text-align:center">تعذّر تحميل المشاريع: '+(err.code||err.message)+'</p>'});
}

// دالة حذف المشروع والصور من تلغرام
$('projectsList').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-id]');if(!b)return;
  if(!confirm('هل أنت متأكد من حذف هذا المشروع؟ سيتم حذف صوره من تلغرام أيضاً.'))return;
  
  const projectId = b.dataset.id;
  const originalText = b.textContent;
  b.disabled = true;
  b.textContent = 'جاري الحذف...';

  try {
    const docRef = doc(db, 'projects', projectId);
    const docSnap = await getDoc(docRef);
    
    if (docSnap.exists()) {
      const projectData = docSnap.data();
      const messageIds = projectData.tg_message_ids || []; 

      for (const msgId of messageIds) {
        try {
          await fetch(`https://api.telegram.org/bot${TG_TOKEN}/deleteMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: TG_CHAT,
              message_id: msgId
            })
          });
        } catch(err) {
          console.error(`Failed to delete message ${msgId} from Telegram:`, err);
        }
      }
    }
    await deleteDoc(docRef);
    alert('تم حذف المشروع وصوره بنجاح.');

  } catch(err){
    console.error(err);
    alert('تعذّر الحذف: '+(err.code||err.message));
    b.disabled = false;
    b.textContent = originalText;
  }
});

/* ---------- photo staging: add, reorder, remove ---------- */
let staged=[]; 
const MAX_PHOTOS=30;
function renderStage(){
  const box=$('thumbs');box.innerHTML='';
  staged.forEach((s,i)=>{
    const t=document.createElement('div');t.className='th';
    t.innerHTML='<img alt=""><span class="no"></span><div class="ctl"><button type="button" data-a="up">▲</button><button type="button" data-a="dn">▼</button><button type="button" data-a="rm" class="x">✕</button></div>';
    t.querySelector('img').src=s.url;t.querySelector('.no').textContent=i+1;t.dataset.i=i;box.appendChild(t);
  });
  $('count').textContent=staged.length?`${staged.length} صورة جاهزة`:'لم تُختَر صور بعد';
}
$('pickBtn').addEventListener('click',()=>$('photos').click());
$('photos').addEventListener('change',e=>{
  const files=[...e.target.files].filter(f=>f.type.startsWith('image/')||/\.(jpe?g|png|webp|heic)$/i.test(f.name));
  for(const f of files){if(staged.length>=MAX_PHOTOS)break;staged.push({file:f,url:URL.createObjectURL(f)})}
  e.target.value=''; 
  renderStage();
});
$('thumbs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const i=+b.closest('.th').dataset.i,a=b.dataset.a;
  if(a==='rm'){URL.revokeObjectURL(staged[i].url);staged.splice(i,1)}
  if(a==='up'&&i>0)[staged[i-1],staged[i]]=[staged[i],staged[i-1]];
  if(a==='dn'&&i<staged.length-1)[staged[i+1],staged[i]]=[staged[i],staged[i+1]];
  renderStage();
});
function clearStage(){staged.forEach(s=>URL.revokeObjectURL(s.url));staged=[];renderStage()}

/* ---------- compress ---------- */
function compress(file,max=1600,q=.82){
  return new Promise(res=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      try{
        const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
        const w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        c.toBlob(b=>{URL.revokeObjectURL(url);res(b||file)},'image/jpeg',q);
      }catch(e){URL.revokeObjectURL(url);res(file)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(file)};
    img.src=url;
  });
}

// الرفع كملف
async function tgUploadDocument(blob, index, total){
  const fd=new FormData();
  fd.append('chat_id',TG_CHAT);
  fd.append('document',blob,`photo_${index}_of_${total}.jpg`);
  
  const res=await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendDocument`,{method:'POST',body:fd});
  let data;
  try{data=await res.json()}catch(e){throw new Error('رد غير مفهوم من تلغرام')}
  if(!data.ok)throw new Error(data.description||'فشل الرفع');
  return { file_id: data.result.document.file_id, message_id: data.result.message_id };
}

/* ---------- publish ---------- */
$('addProjectForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=$('addBtn'),msg=$('addMsg'),bar=$('bar'),barI=$('barI');
  msg.className='msg';msg.textContent='';
  
  if(!staged.length){msg.classList.add('err');msg.textContent='اختر صورة واحدة على الأقل.';return}
  const levels=parseInt($('levels').value,10);
  if(!(levels>=1)){msg.classList.add('err');msg.textContent='أدخل عدد الطوابق.';return}

  btn.disabled=true;bar.style.display='block';barI.style.width='0';
  
  const fileIds = [];
  const messageIds = []; 
  let failedAt = -1;
  
  try{
    for(let i=0;i<staged.length;i++){
      failedAt=i;
      btn.textContent=`جاري إرسال الصورة كملف ${i+1} من ${staged.length}...`;
      const blob=await compress(staged[i].file);
      let tgData;
      
      try{
        tgData = await tgUploadDocument(blob, i+1, staged.length);
      }
      catch(err){ 
        // نظام طوارئ: انتظار 5 ثواني إذا رفض تلغرام الطلب ثم المحاولة مجدداً
        console.warn('انتظار 5 ثواني لتفادي حظر تلغرام...');
        btn.textContent = `انتظار لتفادي حظر تلغرام...`;
        await new Promise(r=>setTimeout(r,5000));
        tgData = await tgUploadDocument(blob, i+1, staged.length);
      }
      
      fileIds.push(tgData.file_id);
      messageIds.push(tgData.message_id);
      barI.style.width=((i+1)/staged.length*100)+'%';
      
      // تأخير 3 ثواني بين كل صورة وصورة لضمان عدم غضب بوت تلغرام
      if(i < staged.length - 1) {
          btn.textContent = `انتظار 3 ثواني قبل إرسال الصورة ${i+2}...`;
          await new Promise(r => setTimeout(r, 3000));
      }
    }
    
    failedAt=-1;
    btn.textContent='جاري الحفظ في قاعدة البيانات...';
    await addDoc(collection(db,'projects'),{
      t:{ar:$('t_ar').value.trim(),fr:$('t_fr').value.trim()},
      loc:{ar:$('loc_ar').value.trim(),fr:$('loc_fr').value.trim()},
      levels,
      photos: fileIds, 
      tg_message_ids: messageIds,
      createdAt: serverTimestamp()
    });
    
    msg.classList.add('ok');msg.textContent='تم نشر المشروع بنجاح!';
    $('addProjectForm').reset();clearStage();
  }catch(err){
    console.error(err);msg.classList.add('err');
    const code=err.code==='permission-denied'?'قواعد Firestore ترفض الكتابة (تأكد أنها تسمح).':(err.message||'خطأ غير معروف');
    msg.textContent=(failedAt>=0?`فشلت الصورة رقم ${failedAt+1}: `:'فشل الحفظ: ')+code;
  }
  
  btn.disabled=false;btn.textContent='رفع ونشر المشروع';
  setTimeout(()=>{bar.style.display='none'},1200);
});
</script>
</body>
</html>
