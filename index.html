<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0e10">
<title>ALAA BUILDING</title>
<meta name="description" content="مؤسسة علاء لأشغال البناء في مختلف مراحله E.T.B T.C.E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Cpath d='M14 50V30h10v20zM27 50V18h10v32zM40 50V24h10v26z' fill='%23ff7a1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0e10;--p1:rgba(255,255,255,.04);--p2:rgba(255,255,255,.08);--line:rgba(255,255,255,.11);--txt:#f2f2f0;--mut:#9a9aa0;--dim:#62626a;--or:#ff7a1a;--dir:1}
html[dir=ltr]{--dir:1}html[dir=rtl]{--dir:-1}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font:400 16px/1.7 'Cairo',system-ui,sans-serif;overflow-x:hidden}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.cond{font-family:'Barlow Condensed','Cairo',sans-serif}
html[lang=ar] *{letter-spacing:0!important}

.bg{position:fixed;inset:0;z-index:-2;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 20%,#000 10%,transparent 75%)}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(600px circle at 80% 8%,rgba(255,122,26,.10),transparent 60%)}

#intro{position:fixed;inset:0;z-index:999;background:#0a0b0c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .7s,visibility .7s;cursor:pointer;padding:20px}
#intro.out{opacity:0;visibility:hidden}
.intro-wrap{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:nowrap;direction:ltr}
.intro-logo{width:clamp(80px,25vw,160px);height:clamp(80px,25vw,160px);border-radius:50%;object-fit:cover;border:2px solid var(--or);box-shadow:0 10px 25px rgba(0,0,0,.6);flex:none;background:#111}
#intro h1{font:900 clamp(1.5rem,5vw,2.4rem)/1.2 'Cairo';text-align:center}
#intro .ld{width:120px;height:2px;background:rgba(255,255,255,.1);overflow:hidden;border-radius:2px}
#intro .ld i{display:block;height:100%;width:0;background:var(--or);animation:ldw 3s linear forwards}
@keyframes ldw{to{width:100%}}

.bar{position:fixed;top:14px;left:0;right:0;margin-inline:auto;width:min(1120px,calc(100% - 28px));z-index:60;display:flex;align-items:center;gap:14px;padding:9px 12px 9px 24px;padding-inline:24px 12px;border-radius:999px;background:rgba(18,18,20,.66);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line)}
.logo{font:800 1.05rem 'Cairo';display:flex;align-items:center;gap:9px}
.logo img{width:28px;height:28px;border-radius:50%;border:1px solid var(--or);object-fit:cover}
.links{display:flex;gap:4px;margin-inline-start:auto}
.links a{position:relative;padding:6px 14px;font-size:.9rem;color:var(--mut);transition:color .2s}
.links a::after{content:"";position:absolute;inset-inline:14px;bottom:1px;height:2px;background:var(--or);transform:scaleX(0);transition:transform .3s}
.links a.on,.links a:hover{color:#fff}.links a.on::after{transform:scaleX(1)}
.lg{background:var(--p1);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font:700 .8rem 'Barlow Condensed',sans-serif;letter-spacing:.06em;transition:.2s}
.lg:hover{background:var(--p2);border-color:rgba(255,255,255,.3)}

.sec{max-width:1120px;margin:0 auto;padding:110px 20px 20px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s;transition-delay:calc(var(--i,0)*.08s)}
.rv.in{opacity:1;transform:none}
.eyebrow{font:600 .78rem 'Barlow Condensed','Cairo';color:var(--or);letter-spacing:.15em;margin-bottom:12px;display:block;}
.display{font:900 clamp(2.2rem,5.2vw,4.6rem)/1.12 'Cairo';letter-spacing:-.01em}
.display span{display:block}
.display.sm{font-size:clamp(1.8rem,3.8vw,3rem)}
.o{color:var(--or)}
.lead{color:var(--mut);max-width:540px}
.center{text-align:center}.center .lead{margin:10px auto 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:12px;border:1px solid var(--line);background:var(--p1);font-weight:700;font-size:.92rem;transition:.25s}
.btn:hover{background:var(--p2);border-color:rgba(255,255,255,.35);transform:translateY(-2px)}
.btn.pri{background:var(--or);color:#140a02;border-color:var(--or)}
.btn.pri:hover{background:#ff9140;box-shadow:0 10px 36px rgba(255,122,26,.3)}
.cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{display:inline-block;font:600 .78rem 'Cairo';padding:4px 12px;border-radius:8px;border:1px solid var(--line);background:var(--p1);color:#d2d2d6}

.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 20px 60px;overflow:hidden;width:100%}
.hero-vid{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.hero-over{position:absolute;inset:0;background:linear-gradient(180deg, rgba(13,14,16,0.65) 0%, var(--bg) 100%);z-index:-1}
.hero .lead{margin:18px auto 24px;max-width:680px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,0.5)}
.hero .display span{display:inline-block;margin:0 6px;text-shadow:0 4px 12px rgba(0,0,0,0.6)}
.note{display:inline-flex;gap:8px;align-items:center;color:#d8d8dc;font-size:.85rem;border:1px dashed rgba(255,122,26,.5);background:rgba(255,122,26,.15);padding:6px 14px;border-radius:10px;margin-bottom:24px;justify-content:center;backdrop-filter:blur(4px)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:10px}
.st{border:1px solid var(--line);border-radius:18px;background:var(--p1);padding:18px 22px}
.st small{color:var(--mut);font-size:.8rem}
.st b{display:block;font:800 2.6rem/1.1 'Barlow Condensed',sans-serif;color:#fff}

.glass{border:1px solid var(--line);border-radius:24px;padding:28px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015))}
.glass h3{font:800 1.4rem 'Cairo'}.glass>p{color:var(--mut);font-size:.9rem;margin:4px 0 16px}
.glass form .btn{width:100%}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;margin-top:34px}
.pc{border:1px solid var(--line);border-radius:18px;background:var(--p1);overflow:hidden;cursor:pointer;transition:transform .35s,border-color .3s,background .3s;text-align:start;display:flex;flex-direction:column;width:100%}
.pc:hover{transform:translateY(-6px);border-color:rgba(255,122,26,.5);background:var(--p2)}
.pc .th{aspect-ratio:16/10;border-bottom:1px solid var(--line);background:#16181c;overflow:hidden;position:relative;display:flex;justify-content:center;align-items:center}
.pc .th img{width:100%;height:100%;object-fit:cover}
.pc .tag{position:absolute;top:10px;inset-inline-start:10px;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font:700 .8rem 'Barlow Condensed','Cairo'}
.bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.bd h3{font-size:1.05rem}.bd .m{color:var(--mut);font-size:.84rem}
.bd .go{margin-top:auto;padding-top:8px;color:var(--or);font-weight:700;font-size:.85rem}
.stars{display:inline-block;direction:ltr;font-size:1rem;line-height:1;letter-spacing:2px!important;background:linear-gradient(90deg,var(--or) var(--v,0%),#3a3a40 var(--v,0%));-webkit-background-clip:text;background-clip:text;color:transparent;vertical-align:middle}
.rt{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--mut)}
.rt b{color:#fff}

.mod{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.82);backdrop-filter:blur(8px)}
.mod.on{display:flex;animation:in .3s both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.mbox{position:relative;width:min(1120px,100%);max-height:94vh;overflow:auto;border-radius:22px;background:#0e0f11;border:1px solid var(--line);display:grid;grid-template-columns:1.5fr 1fr}
.vw{padding:18px;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.view{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#111;border:1px solid var(--line);display:flex;justify-content:center;align-items:center}
.view>*{animation:in .45s both}
.view img{width:100%;height:100%;object-fit:contain;transition:opacity .4s}
.badge{position:absolute;top:12px;inset-inline-start:12px;z-index:2;background:rgba(0,0,0,.7);border:1px solid var(--line);border-radius:10px;padding:3px 12px;font:800 .95rem 'Barlow Condensed'}
.slabel{font-weight:700;min-height:1.7em}
.ctl{display:flex;align-items:center;gap:10px}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--p1);display:grid;place-items:center;font-size:1.1rem;transition:.2s;flex:none}
.ib:hover{background:var(--p2);border-color:var(--or)}
input[type=range]{flex:1;accent-color:var(--or);direction:ltr}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:12px;height:12px;border-radius:50%;border:1px solid var(--dim);background:none;padding:0}
.dots button.on{background:var(--or);border-color:var(--or)}
.dots button.past{background:rgba(255,122,26,.35);border-color:transparent}
.inf{padding:22px;display:flex;flex-direction:column;gap:12px}
.inf h3{font:800 1.4rem/1.3 'Cairo'}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.rsum{display:flex;align-items:center;gap:10px;color:var(--mut)}
.rsum b{font:800 1.8rem 'Barlow Condensed';color:#fff}
.rform{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--p1)}
.rform h4{font-size:.95rem;margin-bottom:8px}
.starin{display:flex;gap:4px;direction:ltr;margin-bottom:10px;width:max-content}
.starin button{background:none;border:none;font-size:1.7rem;line-height:1;color:#3a3a40;padding:0 2px;transition:.15s}
.starin button.on{color:var(--or)}
.starin button:hover{transform:scale(1.15)}
input[type=text],textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px 13px;font:inherit;font-size:.92rem;outline:none;margin-bottom:10px;resize:vertical;transition:border-color .2s}
input[type=text]:focus,textarea:focus{border-color:var(--or)}
textarea{min-height:76px}
::placeholder{color:var(--dim)}
.msg{font-size:.84rem;min-height:1.3em;margin-top:6px}
.rlist{display:flex;flex-direction:column;gap:10px;max-height:260px;overflow:auto;padding-inline-end:4px}
.r1{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--p1)}
.r1 .rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.r1 time{margin-inline-start:auto;color:var(--dim);font-size:.75rem}
.r1 p{font-size:.9rem;color:#d6d6da;margin-top:4px;overflow-wrap:anywhere}
.mut{color:var(--mut);font-size:.9rem}
.mx{position:absolute;top:10px;inset-inline-end:10px;z-index:5;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid var(--line);font-size:1rem}

.cg{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:920px;margin:34px auto 0}
.soc a{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:13px;border:1px solid var(--line);background:var(--p1);transition:.28s;margin-bottom:10px}
.soc a:hover{background:var(--p2);border-color:rgba(255,122,26,.5);transform:translateX(calc(5px * var(--dir)))}
.si{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#0b0b0c;display:grid;place-items:center;font:800 .8rem 'Barlow Condensed';flex:none;color:var(--or)}
.soc b{display:block;font-size:.92rem;line-height:1.3}
.soc small{color:var(--dim);display:block;direction:ltr;text-align:start;font-size:.78rem}
footer{max-width:1120px;margin:80px auto 0;padding:26px 20px 40px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:.85rem}
footer a:hover{color:#fff}

@media(max-width:900px){
 .hero{padding-top:100px;gap:20px}
 .mbox{grid-template-columns:1fr}.vw{border-inline-end:none;border-bottom:1px solid var(--line)}
}
@media(max-width:720px){
 body{padding-bottom:84px}
 .bar{top:0;width:100%;border:none;border-radius:0;backdrop-filter:none;padding:12px 18px 26px;justify-content:space-between;background:linear-gradient(180deg,rgba(13,14,16,.96) 55%,rgba(13,14,16,0));pointer-events:none}
 .bar>*{pointer-events:auto}
 .links{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);margin:0;gap:2px;padding:6px;border-radius:999px;background:rgba(16,16,18,.9);backdrop-filter:blur(16px);border:1px solid var(--line);z-index:60}
 .links a{padding:8px 13px;font-size:.8rem;border-radius:999px;white-space:nowrap}
 .links a::after{display:none}.links a.on{background:rgba(255,122,26,.2)}
 .stats{grid-template-columns:1fr}.cg{grid-template-columns:1fr}.sec{padding-top:88px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{position:absolute;width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--or);border-radius:50%;animation:spin .8s linear infinite;z-index:1}

.view{touch-action:pan-y;-webkit-user-select:none;user-select:none;overscroll-behavior:contain}
.view img{-webkit-user-drag:none;will-change:transform;transform-origin:50% 50%}
.view.big{position:fixed;inset:0;z-index:500;aspect-ratio:auto;border-radius:0;border:none;background:#000}
.fs{display:none;position:fixed;z-index:510;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.65);border:1px solid var(--line);color:#fff;font-size:1.4rem;place-items:center}
.view.big~.fs{display:grid}
.fs.x{top:14px;inset-inline-end:14px}
.fs.l{left:12px;top:50%;transform:translateY(-50%)}
.fs.r{right:12px;top:50%;transform:translateY(-50%)}

/* ===== NEW: floating contact buttons ===== */
.fabs{position:fixed;inset-inline-end:16px;bottom:22px;z-index:70;display:flex;flex-direction:column;gap:10px;align-items:center}
.fab{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;min-width:54px;border-radius:999px;box-shadow:0 10px 28px rgba(0,0,0,.5);transition:transform .2s;color:#fff;font:800 .9rem 'Cairo'}
.fab:hover{transform:translateY(-3px) scale(1.04)}
.fab svg{width:26px;height:26px;fill:currentColor;flex:none}
.fab.wa{background:#25D366;width:58px;height:58px;padding:0;color:#fff}
.fab.wa svg{width:34px;height:34px}
.fab.call{background:var(--or);color:#140a02}
@media(min-width:721px){.fab.call{display:none}}
@media(max-width:720px){.fabs{bottom:84px}}
</style>
</head>
<body class="lock">
<div class="bg"></div><div class="glow"></div>

<div id="intro" aria-hidden="true">
  <div class="intro-wrap">
    <img src="chikor.png" alt="Logo" class="intro-logo" onerror="this.style.display='none'">
  </div>
  <h1 data-i18n="intro"></h1>
  <div class="ld"><i></i></div>
</div>

<header class="bar">
  <a class="logo" href="#home">
    <img src="chikor.png" alt="" onerror="this.style.display='none'">
    <span id="brand"></span>
  </a>
  <nav class="links" aria-label="Main">
    <a href="#home" class="on" data-i18n="nHome"></a>
    <a href="#services" data-i18n="nServices"></a>
    <a href="#projects" data-i18n="nProjects"></a>
    <a href="#contact" data-i18n="nContact"></a>
  </nav>
  <button class="lg" id="lang" aria-label="Language">FR</button>
</header>

<main>
<!-- Hero Section with Full Background Video -->
<section id="home" class="hero">
  <video class="hero-vid" autoplay loop muted playsinline poster="youcef.png">
    <source src="youcef.mp4" type="video/mp4">
  </video>
  <div class="hero-over"></div>
  
  <div style="position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; width:100%; max-width:900px; margin:0 auto;">
    <span class="eyebrow rv" data-i18n="eyebrow"></span>
    <h2 class="display rv" style="--i:1"><span data-i18n="h1a"></span><span class="o" data-i18n="h1b"></span></h2>
    <p class="lead rv" style="--i:2" data-i18n="lead"></p>
    <div class="note rv" style="--i:3">▣ <span data-i18n="scope"></span></div>
    <div class="cta rv" style="--i:4"><a class="btn pri" href="#projects" data-i18n="ctaProj"></a><a class="btn" href="#contact" data-i18n="ctaQuote"></a></div>
  </div>
</section>

<section class="sec" style="padding-top:20px">
  <div class="stats">
    <div class="st rv"><small data-i18n="st1"></small><b id="s1">0</b></div>
    <div class="st rv" style="--i:1"><small data-i18n="st3"></small><b id="s3">0</b></div>
  </div>
</section>

<section id="services" class="sec">
  <div class="center rv"><div class="eyebrow" data-i18n="nServices"></div><h2 class="display sm" data-i18n="svT"></h2></div>

  <div class="glass rv in" style="margin-top:34px;max-width:820px;margin-inline:auto;padding:40px 28px;">
      <div style="text-align:center;margin-bottom:30px;">
          <h3 style="font:900 2.4rem 'Barlow Condensed',sans-serif;color:var(--or);margin:0;letter-spacing:1px;" dir="ltr">ALAA BUILDING</h3>
          <p style="color:var(--mut);font-size:1rem;margin-top:4px;letter-spacing:1px;" dir="ltr">Travaux bâtiment tous Corps d'état</p>
      </div>
      <div data-i18n-html="svText" style="color:var(--txt);font-size:1.1rem;line-height:1.9;"></div>
  </div>
</section>

<section id="projects" class="sec">
  <div class="center rv"><div class="eyebrow" data-i18n="nProjects"></div><h2 class="display sm" data-i18n="pjT"></h2><p class="lead" data-i18n="pjS"></p></div>
  <div class="pgrid" id="pgrid"></div>
</section>

<section id="contact" class="sec">
  <div class="center rv"><div class="eyebrow" data-i18n="nContact"></div><h2 class="display sm" data-i18n="cLead"></h2><p class="lead" data-i18n="cSub"></p></div>
  <div class="cg">
    <form class="glass rv" id="cf" style="--i:1">
      <h3 data-i18n="cTitle"></h3><p data-i18n="cHint"></p>
      <input type="text" id="cn" required maxlength="60" data-ph="phName" autocomplete="name">
      <textarea id="cm" required maxlength="800" data-ph="phMsg"></textarea>
      <button class="btn pri" type="submit" data-i18n="send"></button>
    </form>
    <div class="glass soc rv" style="--i:2">
      <h3 data-i18n="direct"></h3><p data-i18n="directS"></p>
      <a id="lnkWa" target="_blank" rel="noopener"><span class="si">WA</span><span><b>WhatsApp</b><small id="waTxt"></small></span></a>
      <a id="lnkTel"><span class="si">TEL</span><span><b data-i18n="call"></b><small id="telTxt"></small></span></a>
      <a id="lnkLoc" target="_blank" rel="noopener"><span class="si">MAP</span><span><b data-i18n="where"></b><small id="locTxt"></small></span></a>
    </div>
  </div>
</section>
</main>

<footer><span id="copy"></span><span data-i18n="foot"></span><a href="#home" data-i18n="top"></a></footer>

<!-- NEW: floating contact buttons -->

const tgCache=new Map();
async function getTgUrl(fileId){
  if(!fileId)return '';
  if(tgCache.has(fileId))return tgCache.get(fileId);
  try{
    const res=await fetch(`https://api.telegram.org/bot${TG_TOKEN}/getFile?file_id=${fileId}`);
    const data=await res.json();
    if(data.ok){
      const url=`https://api.telegram.org/file/bot${TG_TOKEN}/${data.result.file_path}`;
      tgCache.set(fileId,url);return url;
    }
  }catch(e){console.error("Error fetching TG img",e)}
  return '';
}

async function cloudBackend(){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js')]);
  const db=F.getFirestore(A.initializeApp(FB));

  F.onSnapshot(F.collection(db,'projects'),snap=>{
    PROJECTS=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderStatic();renderCards();
  },e=>console.error("Error fetching projects:",e));

  const col=F.collection(db,'reviews');
  return{mode:'cloud',
    add:r=>F.addDoc(col,{pid:r.pid,name:r.name,stars:r.stars,text:r.text,ts:F.serverTimestamp()}),
    sub:f=>F.onSnapshot(col,s=>f(s.docs.map(d=>{const x=d.data();return{id:d.id,pid:x.pid,name:x.name,stars:x.stars,text:x.text,ts:x.ts&&x.ts.toMillis?x.ts.toMillis():Date.now()}})),e=>console.error(e))};
}

function stat(pid){const a=ALL.filter(r=>r.pid===pid&&r.stars>=1&&r.stars<=5);const n=a.length;return{n,avg:n?a.reduce((t,r)=>t+Number(r.stars),0)/n:0}}

async function renderCards(){
  const T=D(),tok=++rcTok;
  if(!PROJECTS.length){$('#pgrid').innerHTML='';return}
  let html='';
  for(let i=0;i<PROJECTS.length;i++){
    const p=PROJECTS[i];let thumb='';
    if(p.photos&&p.photos.length>0)thumb=await getTgUrl(p.photos[0]);
    html+=`<button class="pc rv in" data-i="${i}"><div class="th"><i class="spin"></i><img src="${esc(thumb)}" alt="" onload="this.style.opacity=1" style="opacity:0;transition:opacity .4s;position:relative;z-index:2"><span class="tag" style="z-index:3">${p.levels||0} ${T.floors}</span></div>

  $('#pgrid').innerHTML=html;
  $$('.pc').forEach(c=>c.addEventListener('click',()=>openProj(+c.dataset.i)));

function refreshStats(){
  $$('.rt[data-pid]').forEach(e=>{const s=stat(e.dataset.pid);e.innerHTML=s.n?`${starsHTML(s.avg)}<b>${s.avg.toFixed(1)}</b><span>(${s.n})</span>`:`<span>${D().noRate}</span>`});
  if(cur>=0)renderRev();
}

let cur=-1,stg=0,timer=null,myStars=0;
const mod=$('#mod');

async function setStage(s){
  zReset();
  const p=PROJECTS[cur];if(!p)return;
  const n=p.photos?p.photos.length:0;
  if(n===0){
    $('#view').innerHTML=`<i class="spin"></i>`;
    $('#rng').max=0;$('#rng').value=0;$('#dots').innerHTML='';$('#slabel').textContent='';
    return;
  }
  stg=Math.max(0,Math.min(n-1,s));
  const my=cur,mine=stg;
  $('#view').innerHTML=`<span class="badge" style="z-index:3">${stg+1} / ${n}</span><i class="spin"></i><img src="" id="mainImg" draggable="false" onload="this.style.opacity=1" style="opacity:0;transition:opacity .4s;position:relative;z-index:2">`;
  const url=await getTgUrl(p.photos[stg]);
  const imgEl=document.getElementById('mainImg');
  if(imgEl&&cur===my&&stg===mine){imgEl.src=url;}
  $('#slabel').textContent=D().photoLbl+" "+(stg+1);
  $('#rng').max=n-1;$('#rng').value=stg;
  $$('#dots button').forEach((b,i)=>{b.classList.toggle('on',i===stg);b.classList.toggle('past',i<stg)});
}

function stopPlay(){clearInterval(timer);timer=null;$('#bPlay').textContent='▶'}
function startPlay(){
  const p=PROJECTS[cur],n=p.photos?p.photos.length:0;
  if(stg>=n-1)setStage(0);
  $('#bPlay').textContent='❚❚';clearInterval(timer);
  timer=setInterval(()=>{if(stg>=n-1){stopPlay();return}setStage(stg+1)},2500);
}

function openProj(i){
  cur=i;
  const p=PROJECTS[i],T=D(),n=p.photos?p.photos.length:0;
  $('#mno').textContent=String(i+1).padStart(2,'0')+' / '+String(PROJECTS.length).padStart(2,'0');
  $('#mt').textContent=p.t?p.t[lang]:'';
  $('#mchips').innerHTML=[p.loc?p.loc[lang]:'',(p.levels||0)+' '+T.floors].map(x=>`<span class="chip">${esc(x)}</span>`).join('');
  $('#rng').max=Math.max(0,n-1);
  $('#dots').innerHTML=Array.from({length:n},(_,k)=>`<button aria-label="Photo ${k+1}" data-k="${k}"></button>`).join('');
  $$('#dots button').forEach(b=>b.addEventListener('click',()=>{stopPlay();setStage(+b.dataset.k)}));
  myStars=0;paintStarIn();
  $('#rmsg').textContent='';$('#rn').value='';$('#rt').value='';
  mod.classList.add('on');document.body.classList.add('lock');
  setStage(0);renderRev();
  if(!RM&&n>1)startPlay();
}

function closeProj(){stopPlay();mod.classList.remove('on');document.body.classList.remove('lock');cur=-1}

const V=$('#view');
const Z={s:1,x:0,y:0,pts:new Map(),pinch:false,pd:1,sx:0,sy:0,bx:0,by:0,moved:false,t0:0,lastTap:0};
const rel=(x,y)=>{const r=V.getBoundingClientRect();return{x:x-r.left-r.width/2,y:y-r.top-r.height/2}};
const step=a=>a==='R'?(lang==='ar'?-1:1):(lang==='ar'?1:-1); // same logic as the keyboard arrows
function zApply(){
  const im=document.getElementById('mainImg');
  if(im)im.style.transform=Z.s>1?`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`:'';
  V.style.touchAction=(Z.s>1||V.classList.contains('big'))?'none':'pan-y';
}
function zClamp(){
  const r=V.getBoundingClientRect(),mx=(Z.s-1)*r.width/2,my=(Z.s-1)*r.height/2;
  Z.x=Math.max(-mx,Math.min(mx,Z.x));Z.y=Math.max(-my,Math.min(my,Z.y));
}
function zReset(){Z.s=1;Z.x=0;Z.y=0;Z.pts.clear();Z.pinch=false;V.style.touchAction=V.classList.contains('big')?'none':'pan-y'}
function zoomTo(ns,mx,my){
  ns=Math.max(1,Math.min(5,ns));
  if(ns<1.02){Z.s=1;Z.x=0;Z.y=0}
  else{Z.x=mx-(mx-Z.x)*ns/Z.s;Z.y=my-(my-Z.y)*ns/Z.s;Z.s=ns;zClamp()}
  zApply();
}
V.addEventListener('pointerdown',e=>{
  if(!document.getElementById('mainImg'))return;
  try{V.setPointerCapture(e.pointerId)}catch(_){}
  Z.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(Z.pts.size===1){Z.sx=e.clientX;Z.sy=e.clientY;Z.bx=Z.x;Z.by=Z.y;Z.moved=false;Z.t0=Date.now()}
  else if(Z.pts.size===2){const[a,b]=[...Z.pts.values()];Z.pd=Math.hypot(a.x-b.x,a.y-b.y)||1;Z.pinch=true;Z.moved=true}
});
V.addEventListener('pointermove',e=>{
  if(!Z.pts.has(e.pointerId))return;
  Z.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(Z.pts.size>=2){
    const[a,b]=[...Z.pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,c=rel((a.x+b.x)/2,(a.y+b.y)/2);
    zoomTo(Z.s*d/Z.pd,c.x,c.y);Z.pd=d;return;
  }
  const dx=e.clientX-Z.sx,dy=e.clientY-Z.sy;
  if(Math.abs(dx)>8||Math.abs(dy)>8)Z.moved=true;
  if(Z.s>1){Z.x=Z.bx+dx;Z.y=Z.by+dy;zClamp();zApply()}
});
function zUp(e,cancel){
  if(!Z.pts.has(e.pointerId))return;
  Z.pts.delete(e.pointerId);
  if(Z.pinch){
    if(Z.pts.size===1){const p=[...Z.pts.values()][0];Z.sx=p.x;Z.sy=p.y;Z.bx=Z.x;Z.by=Z.y}
    if(Z.pts.size===0)Z.pinch=false;
    return;
  }
  if(cancel)return;
  const dx=e.clientX-Z.sx,dy=e.clientY-Z.sy,now=Date.now();
  if(Z.s===1&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4){stopPlay();setStage(stg+step(dx<0?'R':'L'));return}
  if(!Z.moved&&now-Z.t0<350){
    if(now-Z.lastTap<320){Z.lastTap=0;const c=rel(e.clientX,e.clientY);Z.s>1?zoomTo(1,0,0):zoomTo(2.5,c.x,c.y)}
    else Z.lastTap=now;
  }
}
V.addEventListener('pointerup',e=>zUp(e,false));
V.addEventListener('pointercancel',e=>zUp(e,true));
V.addEventListener('wheel',e=>{
  if(!document.getElementById('mainImg'))return;
  e.preventDefault();const c=rel(e.clientX,e.clientY);
  zoomTo(Z.s*(e.deltaY<0?1.2:1/1.2),c.x,c.y);
},{passive:false});

addEventListener('keydown',e=>{
  if(!mod.classList.contains('on'))return;
  if(e.key==='Escape'&&V.classList.contains('big')){e.stopImmediatePropagation();toggleBig(false)}
});

$('#mclose').addEventListener('click',closeProj);
mod.addEventListener('click',e=>{if(e.target===mod)closeProj()});
addEventListener('keydown',e=>{if(!mod.classList.contains('on'))return;if(e.key==='Escape')closeProj();const rtl=lang==='ar';if(e.key==='ArrowRight'){stopPlay();setStage(stg+(rtl?-1:1))}if(e.key==='ArrowLeft'){stopPlay();setStage(stg+(rtl?1:-1))}});
$('#bPrev').addEventListener('click',()=>{stopPlay();setStage(stg-1)});
$('#bNext').addEventListener('click',()=>{stopPlay();setStage(stg+1)});
$('#bPlay').addEventListener('click',()=>timer?stopPlay():startPlay());
$('#rng').addEventListener('input',e=>{stopPlay();setStage(+e.target.value)});

function paintStarIn(){$$('#starin button').forEach((b,i)=>b.classList.toggle('on',i<myStars))}
$('#starin').innerHTML=[1,2,3,4,5].map(k=>`<button type="button" data-k="${k}" aria-label="${k}">★</button>`).join('');
$$('#starin button').forEach(b=>b.addEventListener('click',()=>{myStars=+b.dataset.k;paintStarIn()}));
function renderRev(){
  if(cur<0||!PROJECTS[cur])return;
  const p=PROJECTS[cur],T=D(),{n,avg}=stat(p.id);
  $('#rsum').innerHTML=n?`<b>${avg.toFixed(1)}</b>${starsHTML(avg)}<span>(${n})</span>`:`<span>${T.noRate}</span>`;
  const list=ALL.filter(r=>r.pid===p.id).sort((a,b)=>b.ts-a.ts);
  const loc=lang==='ar'?'ar-DZ':'fr-FR';
  $('#rlist').innerHTML=list.length?list.map(r=>`<div class="r1"><div class="rh"><b>${esc(r.name)}</b>${starsHTML(Number(r.stars)||0)}<time>${new Date(r.ts).toLocaleDateString(loc)}</time></div>${r.text?`<p>${esc(r.text)}</p>`:''}</div>`).join(''):`<p class="mut">${T.noRev}</p>`;
}
$('#rpost').addEventListener('click',async()=>{
  const T=D(),p=PROJECTS[cur],msg=$('#rmsg'),name=$('#rn').value.trim(),text=$('#rt').value.trim();
  msg.style.color='#ff9a9a';
  if(!myStars){msg.textContent=T.pick;return}
  if(!name){msg.textContent=T.needName;return}
  if(store.get('rated_'+p.id)){msg.textContent=T.already;return}
  if(!backend){msg.textContent=T.fail;return}
  $('#rpost').disabled=true;
  try{
    await backend.add({pid:p.id,name:name.slice(0,40),stars:myStars,text:text.slice(0,400)});
    store.set('rated_'+p.id,'1');msg.style.color='#8be09a';msg.textContent=T.thanks;
    $('#rn').value='';$('#rt').value='';myStars=0;paintStarIn();
  }catch(e){console.error(e);msg.textContent=T.fail}
  $('#rpost').disabled=false;
});

$('#cf').addEventListener('submit',e=>{
  e.preventDefault();const n=$('#cn').value.trim(),m=$('#cm').value.trim();if(!n||!m)return;
  window.open('https://wa.me/'+CFG.wa+'?text='+encodeURIComponent(`${D().wa} ${n}.\n\n${m}`),'_blank','noopener');
});

function applyLang(l){
  lang=l;const T=I[l];
  document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
  $$('[data-i18n]').forEach(e=>{if(T[e.dataset.i18n]!=null)e.textContent=T[e.dataset.i18n]});
  $$('[data-i18n-html]').forEach(e=>{if(T[e.dataset.i18nHtml]!=null)e.innerHTML=T[e.dataset.i18nHtml]});
  $$('[data-ph]').forEach(e=>e.placeholder=T[e.dataset.ph]);
  $('#lang').textContent=l==='ar'?'FR':'AR';store.set('lang',l);
  renderStatic();renderCards();
  if(cur>=0){const keep=stg,i=cur;stopPlay();openProj(i);stopPlay();setStage(keep)}
}
$('#lang').addEventListener('click',()=>applyLang(lang==='ar'?'fr':'ar'));

const intro=$('#intro');
function endIntro(){if(!intro||intro.dataset.done)return;intro.dataset.done=1;intro.classList.add('out');document.body.classList.remove('lock');setTimeout(()=>intro.remove(),800)}
if(RM){intro.remove();document.body.classList.remove('lock')}else{intro.addEventListener('click',endIntro);setTimeout(endIntro,3000)}

const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting)return;e.target.classList.add('in');io.unobserve(e.target);
  const b=e.target.querySelector('b[id^=s]');
  if(b&&!b.dataset.done){b.dataset.done=1;const to=+b.dataset.n||0;let v=0;if(!to){b.textContent=0;return}const t=setInterval(()=>{b.textContent=++v;if(v>=to)clearInterval(t)},Math.max(30,900/to))}
}),{threshold:.12});
function observeRv(){$$('.rv:not(.in)').forEach(el=>io.observe(el))}
const links=$$('.links a'),so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
['home','services','projects','contact'].forEach(id=>so.observe(document.getElementById(id)));

$('#fabWa').href='https://wa.me/'+CFG.wa;
$('#fabCall').href='tel:'+CFG.phone;

(function(){
  const v=$('.hero-vid');if(!v)return;
  const c=navigator.connection||{};
  if(c.saveData||/^(slow-2g|2g|3g)$/.test(c.effectiveType||'')){
    v.removeAttribute('autoplay');v.pause();
    const s=v.querySelector('source');if(s)s.remove();
    v.load();return;
  }
  new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){const p=v.play();if(p&&p.catch)p.catch(()=>{})}else v.pause();
  })).observe(v);
})();

const sl=store.get('lang');applyLang(I[sl]?sl:'ar');observeRv();
(async()=>{
  try{
    backend=await cloudBackend();
    backend.sub(a=>{ALL=a;refreshStats()});
  }catch(e){console.error('Firebase failed',e)}
})();
</script>
</body>
</html>
